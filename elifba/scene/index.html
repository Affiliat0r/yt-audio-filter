<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>Elifba</title>
<style>
  /* Amiri is a naskh face with proper harakat mark positioning. It is
     installed on this machine; the file URL is the fallback for a machine
     where it exists but is not registered under that family name. */
  @font-face {
    font-family: 'ElifbaArabic';
    src: local('Amiri'), local('Amiri Regular'),
         url('file:///C:/Windows/Fonts/Amiri-Regular.ttf') format('truetype');
    font-weight: 400;
  }

  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }

  /* Every size is in --u, which init() sets to 1% of the stage height, so
     720p is a pure scale of 1080p and nothing needs a second set of numbers.
     There is deliberately no Latin text anywhere on screen: a three-year-old
     cannot read it, and a transliteration sitting under the letter invites
     reading that instead of the letter itself. Everything the words used to
     carry is now carried by the voice, by the accent colour, and by the dots. */
  #stage {
    position: relative;
    overflow: hidden;
    display: block;
    background: linear-gradient(168deg, #FFFAF2 0%, #FDF1DF 52%, #F7E4CB 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* Soft depth behind everything. Static -- the flowers do the moving. */
  .blob {
    position: absolute; border-radius: 50%; pointer-events: none;
    filter: blur(calc(var(--u) * 5));
  }
  #blobA {
    width: calc(var(--u) * 62); height: calc(var(--u) * 62);
    left: calc(var(--u) * -18); top: calc(var(--u) * 52);
    background: rgba(214, 168, 106, 0.10);
  }
  #blobB {
    width: calc(var(--u) * 44); height: calc(var(--u) * 44);
    left: calc(var(--u) * 150); top: calc(var(--u) * -12);
    background: rgba(214, 168, 106, 0.09);
  }

  /* The garden. Flowers are built once in init() and only transformed per
     frame, so the DOM never churns during a render. */
  #garden {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* Accent wash behind the card; colour and strength are set per frame. */
  #glow {
    position: absolute; left: 50%; top: calc(var(--u) * 45);
    width: 130%; height: calc(var(--u) * 115);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Pulsing outline that means "your turn" without saying so. */
  #ring {
    position: absolute; left: 50%; top: calc(var(--u) * 13);
    transform: translateX(-50%);
    width: calc(var(--u) * 74);
    height: calc(var(--u) * 64);
    border-radius: calc(var(--u) * 7);
    border: calc(var(--u) * 0.7) solid #D64545;
    opacity: 0;
  }

  #card {
    position: absolute; left: 50%; top: calc(var(--u) * 16);
    transform: translateX(-50%);
    width: calc(var(--u) * 68);
    height: calc(var(--u) * 58);
    border-radius: calc(var(--u) * 5);
    background: #FFFFFF;
    box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 4.2) rgba(96, 66, 34, 0.15),
                0 calc(var(--u) * 0.3) calc(var(--u) * 0.9) rgba(96, 66, 34, 0.07);
  }

  /* The two stacked copies that give the harakat its own colour: the bottom
     layer draws letter+mark in the accent, the top layer redraws the bare
     letter in ink over it. A combining mark has zero advance width, so both
     layers put the base glyph on exactly the same pixels and only the mark
     is left showing in colour. */
  .glyph {
    position: absolute;
    left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    text-align: center;
    font-family: 'ElifbaArabic', 'Amiri', 'Scheherazade New', serif;
    font-size: calc(var(--u) * 32);
    line-height: 1.5;
    direction: rtl;
    /* Kill every optional shaping feature that could make the two layers
       disagree about where the base letter sits. */
    font-kerning: none;
    font-variant-ligatures: none;
  }
  #glyphMark { color: #D64545; }
  #glyphBase { color: #2A2018; }

  #dots {
    position: absolute; top: calc(var(--u) * 87); left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--u) * 2.4);
    height: calc(var(--u) * 3);
  }
  .dot {
    width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8);
    border-radius: 50%;
    background: #E6D6C1;
  }
</style>

<div id="stage">
  <div class="blob" id="blobA"></div>
  <div class="blob" id="blobB"></div>

  <svg id="garden" xmlns="http://www.w3.org/2000/svg"></svg>

  <svg id="glow" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <radialGradient id="glowGrad">
        <stop id="glowInner" offset="0%" stop-color="#D64545" stop-opacity="0.20"/>
        <stop id="glowOuter" offset="72%" stop-color="#D64545" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#glowGrad)"/>
  </svg>

  <div id="ring"></div>

  <div id="card">
    <div class="glyph" id="glyphMark"></div>
    <div class="glyph" id="glyphBase"></div>
  </div>

  <div id="dots"></div>
</div>

<script src="timeline.js"></script>
<script src="main.js"></script>
</html>
