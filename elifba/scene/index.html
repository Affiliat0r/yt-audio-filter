<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>Elifba</title>
<style>
  /* Amiri is a naskh face with proper harakat mark positioning. It is
     installed on this machine; the file URL is the fallback for a machine
     where it exists but is not registered under that family name. */
  @font-face {
    font-family: 'ElifbaArabic';
    src: local('Amiri'), local('Amiri Regular'),
         url('file:///C:/Windows/Fonts/Amiri-Regular.ttf') format('truetype');
    font-weight: 400;
  }

  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }

  /* Every size below is in --u, which init() sets to 1% of the stage height,
     so 720p is a pure scale of 1080p and nothing needs a second set of
     numbers. Vertical positions are `top` in --u rather than percentages:
     the layout is a fixed rhythm down the frame, and reading it as absolute
     units is what makes it obvious that nothing runs off the bottom. */
  #stage {
    position: relative;
    overflow: hidden;
    display: block;
    background: linear-gradient(168deg, #FFFAF2 0%, #FDF1DF 52%, #F7E4CB 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #2A2018;
  }

  /* Static background shapes. They give the frame some depth without adding
     anything that moves -- a three-year-old should be looking at the letter,
     not at the decoration. */
  .blob {
    position: absolute; border-radius: 50%; pointer-events: none;
    filter: blur(calc(var(--u) * 5));
  }
  #blobA {
    width: calc(var(--u) * 62); height: calc(var(--u) * 62);
    left: calc(var(--u) * -18); top: calc(var(--u) * 52);
    background: rgba(214, 168, 106, 0.10);
  }
  #blobB {
    width: calc(var(--u) * 44); height: calc(var(--u) * 44);
    left: calc(var(--u) * 150); top: calc(var(--u) * -12);
    background: rgba(214, 168, 106, 0.09);
  }

  /* Accent wash behind the card; colour and strength are set per frame. */
  #glow {
    position: absolute; left: 50%; top: calc(var(--u) * 37);
    width: 130%; height: calc(var(--u) * 110);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  #title {
    position: absolute; top: calc(var(--u) * 5.5); left: 0; right: 0;
    text-align: center;
    font-size: calc(var(--u) * 2.7);
    letter-spacing: calc(var(--u) * 0.4);
    text-transform: uppercase;
    font-weight: 600;
    color: #B08968;
  }

  #card {
    position: absolute; left: 50%; top: calc(var(--u) * 13);
    transform: translateX(-50%);
    width: calc(var(--u) * 56);
    height: calc(var(--u) * 47);
    border-radius: calc(var(--u) * 5);
    background: #FFFFFF;
    box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 4.2) rgba(96, 66, 34, 0.15),
                0 calc(var(--u) * 0.3) calc(var(--u) * 0.9) rgba(96, 66, 34, 0.07);
  }

  /* The two stacked copies that give the harakat its own colour: the bottom
     layer draws letter+mark in the accent, the top layer redraws the bare
     letter in ink over it. A combining mark has zero advance width, so both
     layers put the base glyph on exactly the same pixels and only the mark
     is left showing in colour. */
  .glyph {
    position: absolute;
    left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    text-align: center;
    font-family: 'ElifbaArabic', 'Amiri', 'Scheherazade New', serif;
    font-size: calc(var(--u) * 25);
    line-height: 1.45;
    direction: rtl;
    /* Kill every optional shaping feature that could make the two layers
       disagree about where the base letter sits. */
    font-kerning: none;
    font-variant-ligatures: none;
  }
  #glyphMark { color: #D64545; }
  #glyphBase { color: #2A2018; }

  #letterName {
    position: absolute; top: calc(var(--u) * 63); left: 0; right: 0;
    text-align: center;
    font-size: calc(var(--u) * 3.0);
    letter-spacing: calc(var(--u) * 0.25);
    text-transform: uppercase;
    font-weight: 600;
    color: #BA9A76;
  }

  #harakatName {
    position: absolute; top: calc(var(--u) * 68.5); left: 0; right: 0;
    text-align: center;
    font-size: calc(var(--u) * 4.6);
    font-weight: 600;
    color: #D64545;
  }

  #say {
    position: absolute; top: calc(var(--u) * 76); left: 0; right: 0;
    text-align: center;
    font-size: calc(var(--u) * 9);
    line-height: 1.15;
    font-weight: 700;
    color: #2A2018;
  }

  #prompt {
    position: absolute; left: 0; right: 0;
    text-align: center;
    font-weight: 700;
    color: #2A2018;
  }

  #dots {
    position: absolute; top: calc(var(--u) * 91); left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--u) * 2.2);
    height: calc(var(--u) * 3);
  }
  .dot {
    width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7);
    border-radius: 50%;
    background: #E6D6C1;
  }
</style>

<div id="stage">
  <div class="blob" id="blobA"></div>
  <div class="blob" id="blobB"></div>

  <svg id="glow" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <radialGradient id="glowGrad">
        <stop id="glowInner" offset="0%" stop-color="#D64545" stop-opacity="0.20"/>
        <stop id="glowOuter" offset="72%" stop-color="#D64545" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#glowGrad)"/>
  </svg>

  <div id="title"></div>

  <div id="card">
    <div class="glyph" id="glyphMark"></div>
    <div class="glyph" id="glyphBase"></div>
  </div>

  <div id="letterName"></div>
  <div id="harakatName"></div>
  <div id="say"></div>
  <div id="prompt"></div>
  <div id="dots"></div>
</div>

<script src="timeline.js"></script>
<script src="main.js"></script>
</html>
