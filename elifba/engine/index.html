<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Elif-Ba</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="pattern"></div>
    <div id="blobs" class="layer"></div>
    <!-- stars burst from *behind* the cards: nothing small and loose may land on a letter -->
    <div id="fx" class="layer"></div>
    <div id="scenes" class="layer"></div>
    <!-- the kalem and its divit: back of the inkwell, the pen, then the inkwell's
         front, so the nib sinks into the ink when it rests -->
    <svg id="well-back" viewBox="0 0 220 170" width="220" height="170"></svg>
    <svg id="pen"></svg>
    <svg id="well-front" viewBox="0 0 220 170" width="220" height="170"></svg>
    <!-- prompts sit above the pen: it may pass behind a word, never through it -->
    <div id="overlay" class="layer"></div>
  </div>
  <script src="engine.js"></script>
</body>
</html>
