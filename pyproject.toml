[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-audio-filter"
version = "1.0.0"
description = "CLI tool to remove background music from MP4 videos using AI (Demucs)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Product Team"}
]
keywords = ["audio", "video", "demucs", "vocal-isolation", "music-removal", "ffmpeg", "youtube", "yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video :: Conversion",
]
# Kept deliberately light. Everything here is needed to download, render an
# overlay, and upload — which is all most workers ever do. Demucs and PyTorch
# add ~5 GB and are only needed for music removal, so they live in the
# "music" extra below. `yt_audio_filter/__init__.py` imports process_video
# lazily so the package works without them.
dependencies = [
    "yt-dlp>=2025.05.22",  # Required for POT provider bot detection bypass
    "pytubefix>=10.0.0",   # Application-less primary downloader (no Deno/Node needed)
    "requests>=2.31.0",    # worker/client.py + worker/blob.py; previously only
                           # present transitively via torch, so a light install
                           # crashed on import once torch moved to an extra.
    # Small (~20 MB) and the worker's whole point is publishing, so these are
    # core rather than an extra — a worker that cannot upload is half a worker.
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.optional-dependencies]
# Music removal only. ~5 GB installed, and on a machine without an NVIDIA GPU
# Demucs falls back to CPU at roughly 10-20x slower than real time — so a
# second laptop is usually better off skipping this and targeting the GPU box
# for music-removal jobs.
music = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
# Retained so `pip install -e ".[upload]"` in older docs keeps working; the
# packages themselves are core dependencies now.
upload = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
]
app = [
    "streamlit>=1.30",
    "pillow>=10.0.0",
]

[project.scripts]
yt-audio-filter = "yt_audio_filter.cli:main"
yt-channel-scrape = "yt_audio_filter.scraper:main"
yt-scheduler = "yt_audio_filter.scheduler:main"
yt-quran-overlay = "yt_audio_filter.overlay_cli:main"

[project.urls]
Homepage = "https://github.com/example/yt-audio-filter"
Documentation = "https://github.com/example/yt-audio-filter#readme"
Repository = "https://github.com/example/yt-audio-filter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
