<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toy train — procedural scene</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100%;
    height: 100%;
  }
  #stage {
    display: block;
    margin: 0;
    padding: 0;
    border: 0;
  }
  #fault {
    position: fixed;
    inset: 0;
    display: none;
    padding: 24px;
    font: 14px/1.5 ui-monospace, Consolas, monospace;
    color: #ffdede;
    background: #4a1414;
    white-space: pre-wrap;
  }
</style>

<script>
/*
 * Determinism guard.
 *
 * Nothing in visuals/scene/ calls Math.random() — all randomness comes from the
 * seeded PRNG in rng.mjs. three.js itself calls it when it mints object UUIDs,
 * which does not affect pixels, but replacing the global with a fixed-seed
 * stream removes the possibility entirely. The call counter is a tripwire: it
 * must not advance during renderAt().
 */
(function () {
  var state = 0x9e3779b9 >>> 0;
  var calls = 0;
  Math.random = function seededRandom() {
    calls++;
    state = (state + 0x6d2b79f5) | 0;
    var t = Math.imul(state ^ (state >>> 15), 1 | state);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  window.__determinism = {
    get mathRandomCalls() {
      return calls;
    },
  };
})();

/*
 * Placeholder API, replaced by main.mjs once it evaluates. If the module never
 * loads, calling init() explains why instead of hanging the capture step.
 */
window.__movie = {
  ready: false,
  async init() {
    throw new Error(
      'scene/main.mjs did not load. Over file:// Chrome refuses ES module ' +
      'imports unless it is launched with --allow-file-access-from-files.'
    );
  },
  async renderAt() {
    throw new Error('scene/main.mjs did not load; nothing to render.');
  },
};

window.addEventListener(
  'error',
  function (event) {
    var target = event.target;
    if (!target || target.tagName !== 'SCRIPT') return;
    var fault = document.getElementById('fault');
    if (fault) {
      fault.style.display = 'block';
      fault.textContent =
        'Failed to load ' + (target.src || 'a script') + '\n\n' +
        'Over file:// Chrome blocks ES module imports as cross-origin. ' +
        'Launch it with --allow-file-access-from-files (or serve the ' +
        'directory over http://).';
    }
  },
  true
);
</script>

<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<pre id="fault"></pre>
<script type="module" src="./main.mjs"></script>
</body>
</html>
